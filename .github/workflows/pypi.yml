name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Immutable release tag (vX.Y.Z); run this workflow from main'
        required: true
        type: string
      index:
        description: 'Destination; rehearse on TestPyPI before promoting the same assets'
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((inputs.index == 'pypi' && vars.PYPI_PUBLISH_ENABLED == 'true') ||
       (inputs.index == 'testpypi' && vars.TESTPYPI_PUBLISH_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify release identity and retrieve exact assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INDEX: ${{ inputs.index }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$RELEASE_INDEX" == pypi ]]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public
          fi
          commit=$(python .github/release.py tag "$RELEASE_TAG")
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.immutable and (.draft | not) and (.prerelease | not)')" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$RELEASE_TAG" --jq .sha)" = "$commit"
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          version=${RELEASE_TAG#v}
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "udlex-$version-*.whl" --pattern "udlex-$version.tar.gz"
          shopt -s nullglob
          wheels=(dist/udlex-"$version"-*.whl)
          sdist="dist/udlex-$version.tar.gz"
          if [[ ${#wheels[@]} -ne 6 || ! -f "$sdist" ]]; then
            echo 'Expected six wheels and one source distribution.' >&2
            exit 1
          fi
          for asset in "${wheels[@]}" "$sdist"; do
            gh release verify-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-python-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.index }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-python-packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: ${{ inputs.index == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          attestations: true
          skip-existing: false
