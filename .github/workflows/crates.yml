name: Publish Rust crate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z); run this workflow from main'
        required: true
        type: string
      dry-run:
        description: 'Package and verify the crate without uploading it'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: crates-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check out the release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # Checks that the tag is on main and names the crate version.
          commit=$(python .github/release.py tag "$RELEASE_TAG")
          git checkout --detach "$commit"
      - name: Exchange the workflow identity for a short-lived crates.io token
        if: ${{ !inputs.dry-run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish udlex-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          rustup show active-toolchain
          if [[ "$DRY_RUN" == true ]]; then
            cargo publish --locked --dry-run --manifest-path rust/Cargo.toml -p udlex-rs
          else
            cargo publish --locked --manifest-path rust/Cargo.toml -p udlex-rs
          fi
