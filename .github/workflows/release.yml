name: Release wheels

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
      maturin: ${{ steps.metadata.outputs.maturin }}
      rust: ${{ steps.metadata.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check release tag and read build pins
        id: metadata
        run: python .github/release.py prepare

  wheels:
    needs: prepare
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
        python: ['3.11', '3.14t', '3.15t']
        exclude:
          # The abi3t wheel links python3t.dll and is not tested on Windows.
          - os: windows-2025
            python: '3.15t'
        include:
          - os: ubuntu-24.04
            platform: manylinux_2_34_x86_64
          - os: ubuntu-24.04-arm
            platform: manylinux_2_34_aarch64
          - os: macos-15
            platform: macosx_11_0_arm64
          - os: macos-15-intel
            platform: macosx_10_12_x86_64
          - os: windows-2025
            platform: win_amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python }}
      - name: Remap release build paths
        run: |
          cargo_home=${CARGO_HOME:-"$HOME/.cargo"}
          if [[ "$RUNNER_OS" == Linux ]]; then
            cargo_home=/root/.cargo
          elif [[ "$RUNNER_OS" == Windows ]]; then
            # rustc sees C:\Users\..., not the /c/Users/... spelling of Git Bash.
            cargo_home=$(cygpath -w "$cargo_home")
          fi
          printf 'CARGO_ENCODED_RUSTFLAGS=%s\037%s\n' \
            "--remap-path-prefix=$GITHUB_WORKSPACE=/udlex" \
            "--remap-path-prefix=$cargo_home=/cargo" >> "$GITHUB_ENV"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: ${{ needs.prepare.outputs.maturin }}
          rust-toolchain: ${{ needs.prepare.outputs.rust }}
          manylinux: '2_34'
          # Windows has no versioned python3.X executables; manylinux builds use the container's.
          args: >-
            --release --locked --out dist --interpreter
            ${{ runner.os == 'Windows' && steps.python.outputs.python-path || format('python{0}', matrix.python) }}
      - name: Check wheel ABI and platform tags
        env:
          BUILD_PYTHON: ${{ matrix.python }}
          WHEEL_PLATFORM: ${{ matrix.platform }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: python .github/release.py wheel
      - name: Test installed wheel outside the checkout
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python -m pip install --no-index --no-deps dist/*.whl
          cd "$(mktemp -d)"
          python -I -W error::RuntimeWarning - <<'PY'
          import os
          import sys
          import sysconfig
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path

          import udlex

          assert udlex.__version__ == os.environ["EXPECTED_VERSION"]
          if sysconfig.get_config_var("Py_GIL_DISABLED"):
              assert not sys._is_gil_enabled()
          Path("forms.tsv").write_text("cats\tcat\nmice\tmouse\n", encoding="utf-8")
          Path("bundle").mkdir()
          udlex.build_lexicon(
              "bundle/eng", train=None, dev=None, test=None,
              paradigms=[("example", "forms.tsv", False, False)],
              name="eng", language="English", iso639_3="eng",
          )
          lexicon = udlex.load("bundle", "eng")
          tokens = ["cats", "mice", "unknown"]
          with ThreadPoolExecutor(max_workers=4) as executor:
              results = executor.map(lexicon.lemmatize, [tokens] * 8)
              assert all(result == ["cat", "mouse", "unknown"] for result in results)
          PY
          test "$(python -I -m udlex lemma -q eng cats mice | tr -d '\r')" = $'cat\nmouse'
      - name: Build source distribution once
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.11'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: ${{ needs.prepare.outputs.maturin }}
          rust-toolchain: ${{ needs.prepare.outputs.rust }}
          command: sdist
          args: --manifest-path rust/Cargo.toml --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  native:
    needs: [prepare, wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x86_64, triple: x86_64-unknown-linux-gnu, suffix: so}
          - {os: ubuntu-24.04-arm, platform: linux-aarch64, triple: aarch64-unknown-linux-gnu, suffix: so}
          - {os: macos-15, platform: macos-arm64, triple: aarch64-apple-darwin, suffix: dylib}
          - {os: macos-15-intel, platform: macos-x86_64, triple: x86_64-apple-darwin, suffix: dylib}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Build the C library
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          rustup target add "$TRIPLE"
          flags=$(printf '%s\037%s' "--remap-path-prefix=$GITHUB_WORKSPACE=/udlex" \
            "--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo")
          if [[ "$RUNNER_OS" == Linux ]]; then
            # zig links against glibc 2.34, the floor of the release wheels.
            python -m pip install ziglang==0.17.1 cargo-zigbuild==0.24.1
            CARGO_ENCODED_RUSTFLAGS=$flags cargo zigbuild --release --locked \
              --manifest-path rust/Cargo.toml -p udlex-capi --target "$TRIPLE.2.34"
          else
            if [[ "$TRIPLE" == aarch64-* ]]; then
              export MACOSX_DEPLOYMENT_TARGET=11.0
            else
              export MACOSX_DEPLOYMENT_TARGET=10.12
            fi
            flags=$(printf '%s\037%s' "$flags" "-Clink-arg=-Wl,-install_name,@rpath/libudlex_capi.dylib")
            CARGO_ENCODED_RUSTFLAGS=$flags cargo build --release --locked \
              --manifest-path rust/Cargo.toml -p udlex-capi --target "$TRIPLE"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-${{ matrix.os }}-3.11
          path: wheel
      - name: Test the shared and the static library from C
        env:
          TRIPLE: ${{ matrix.triple }}
          SUFFIX: ${{ matrix.suffix }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          lib="$PWD/rust/target/$TRIPLE/release"
          if grep -aqE '/Users/|/home/runner/|runneradmin' "$lib/libudlex_capi.$SUFFIX" "$lib/libudlex_capi.a"; then
            echo 'The C library exposes build paths.' >&2
            exit 1
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            newest=$(objdump -T "$lib/libudlex_capi.so" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
            test "$(printf '%s\nGLIBC_2.34\n' "$newest" | sort -V | tail -1)" = GLIBC_2.34
            static='-lgcc_s -lutil -lrt -lpthread -lm -ldl -lc'
          else
            static='-liconv -lSystem -lc -lm'
          fi
          python -m pip install --no-index --no-deps wheel/udlex-*.whl
          probe=$(mktemp -d)
          python -I - "$probe" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          sample, = re.findall(r'```python\n(.*?)```', Path('README.md').read_text(), re.S)
          os.chdir(sys.argv[1])
          exec(compile(sample, 'README.md', 'exec'))
          PY
          cc -std=c11 -Wall -Wextra -Werror -I rust/capi/include rust/capi/tests/smoke.c \
            -L "$lib" -Wl,-rpath,"$lib" -ludlex_capi -o "$probe/shared"
          # shellcheck disable=SC2086
          cc -std=c11 -Wall -Wextra -Werror -I rust/capi/include rust/capi/tests/smoke.c \
            "$lib/libudlex_capi.a" $static -o "$probe/static"
          for binary in shared static; do
            "$probe/$binary" "$probe/example-bundle/eng" "$EXPECTED_VERSION"
          done
      - name: Pack the archive
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: python .github/release.py native "${{ matrix.platform }}" "rust/target/${{ matrix.triple }}/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}
          path: dist-native/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, wheels, native]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Create release draft with compiled wheels and C libraries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$GITHUB_REF_NAME" --jq .sha)
          test "$current" = "$RELEASE_COMMIT"
          cd dist
          shopt -s nullglob
          wheels=(udlex-"$RELEASE_VERSION"-*.whl)
          sdist="udlex-$RELEASE_VERSION.tar.gz"
          natives=(udlex-native-"$RELEASE_VERSION"-*.tar.gz)
          if [[ ${#wheels[@]} -ne 14 || ${#natives[@]} -ne 4 || ! -f "$sdist" ]]; then
            echo 'Expected fourteen wheels, four C libraries and one source distribution.' >&2
            exit 1
          fi
          # SHA256SUMS is the dictionary manifest's; the engine has its own.
          sha256sum -- "${wheels[@]}" "$sdist" "${natives[@]}" > SHA256SUMS-engine
          gh release create "$GITHUB_REF_NAME" "${wheels[@]}" "$sdist" "${natives[@]}" SHA256SUMS-engine \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "udlex $RELEASE_VERSION" --notes "Python packages for $GITHUB_REF_NAME."
